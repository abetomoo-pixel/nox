<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOX 初期設定 v3（iPad 向け）</title>
<style>
:root{
  --bg:#0e0e0d;--s1:#1a1916;--s2:#23211d;--s3:#2c2a25;--line:#3d3a33;--line2:#55514a;

  --ok:#2f7a47;--okbg:#17261b;--oktext:#bfe3c8;--warnbg:#33280f;--warntext:#f3d58e;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input,select{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(14,14,13,.97);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(14,14,13,.97)}
.bar{max-width:1200px;margin:0 auto;padding:12px 24px 8px;display:flex;align-items:center;gap:14px}
.mark{width:38px;height:38px;border:1px solid var(--gold);border-radius:10px;display:grid;place-items:center;color:var(--gold);font:19px Georgia,serif;flex:none}
.bar h1{margin:0;font-size:18px}.bar .sub{font-size:13px;color:var(--muted)}
.bar .save{margin-left:auto;font-size:13px;color:var(--muted)}
.steps{max-width:1200px;margin:0 auto;padding:0 24px 12px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;list-style:none}
.steps button{width:100%;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:1px solid var(--line);background:var(--s1);color:var(--muted);text-align:left}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px}
.steps .t{font-size:14px;line-height:1.2}
.steps button.done{color:var(--oktext);border-color:#2f5a3a;background:var(--okbg)}
.steps button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps button[aria-current="step"]{background:var(--gold);border-color:var(--gold);color:#17140c;font-weight:700}
.steps button[aria-current="step"] .n{background:#17140c;border-color:#17140c;color:var(--gold)}
main{max-width:1200px;margin:0 auto;padding:22px 24px 140px;display:flex;flex-direction:column;gap:18px}
.head h2{margin:0 0 4px;font-size:26px}.head p{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card h3{margin:0;font-size:19px}.card .lead{margin:-10px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px}.field>span{font-size:14px;color:var(--muted)}
input[type=text],input[type=number],input[type=time],select{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.unit{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--bg)}
.unit input{border:0;border-radius:0;min-width:0;text-align:right}
.unit em{font-style:normal;display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:14px;border-left:1px solid var(--line);white-space:nowrap;background:var(--s2)}
.unit .pre{border-left:0;border-right:1px solid var(--line)}
.choice{position:relative;min-height:120px;border:1px solid var(--line);border-radius:14px;background:var(--s2);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--text)}
.choice b{font-size:17px}.choice small{font-size:14px;color:var(--muted)}
.choice .price{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:14px}
.choice[aria-pressed="true"]{border:2px solid var(--blueline);background:var(--bluebg);padding:15px}
.choice[aria-pressed="true"]::after{content:"選択中";position:absolute;top:12px;right:12px;font-size:12px;background:var(--blue);color:#fff;border-radius:999px;padding:2px 10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg button{min-height:46px;padding:8px 14px;border:0;background:transparent;color:var(--muted);font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:700}
.seg button[aria-pressed="true"][data-v="off"],.seg button[aria-pressed="true"][data-v="none"]{background:#4a4740;color:#fff}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--s2)}
.opt b{font-size:16px;display:block}.opt small{font-size:14px;color:var(--muted);display:block}
.opt.dimmed b,.opt.dimmed small{color:var(--dim)}
.state{font-size:13px;color:var(--muted);margin-top:4px;text-align:right}
.rule{border:1px solid var(--line);border-radius:14px;background:var(--s2);overflow:hidden}
.rule .rh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rule .rh b{font-size:17px}.rule .rh small{color:var(--muted);font-size:14px}
.rule .rb{padding:16px;display:flex;flex-direction:column;gap:14px}
.prio{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.ext{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto auto;gap:10px;align-items:center}
.ext .lab{font-size:14px;color:var(--muted);min-width:70px}
.radio{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.radio input,.ck input{width:22px;height:22px}
.tier{display:grid;grid-template-columns:40px minmax(0,1fr) auto minmax(0,1fr) auto;gap:10px;align-items:center}
.tier .k{font-size:14px;color:var(--muted)}
.menu-cat{border:1px solid var(--line);border-radius:14px;background:var(--s2);overflow:hidden}
.menu-cat .mh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.menu-cat .mh b{font-size:17px;margin-right:auto}
.mrow{display:grid;grid-template-columns:44px minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.2fr) auto auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #2c2a25}
.mrow:last-child{border-bottom:0}
.mrow.off{opacity:.5}
.mrow .hd{font-size:13px;color:var(--muted)}
.ck{display:flex;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:14px;background:var(--bg)}
.chip.vip{border-color:#6b5626;color:var(--warntext)}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,.9fr) auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--s2)}
.btn{min-height:52px;padding:12px 28px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:17px}
.btn2{min-height:46px;padding:9px 16px;border-radius:12px;border:1px solid var(--blueline);background:transparent;color:var(--bluetext);font-size:15px}
.btn3{min-height:46px;padding:9px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);color:var(--text);font-size:15px}
.note{font-size:14px;color:var(--muted);margin:0}
.info{border:1px solid #4a5f80;background:#141c28;border-radius:12px;padding:12px 14px;font-size:14px;color:#cfdcef}
.warn{border:1px solid #6b5626;background:var(--warnbg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--warntext)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(14,14,13,.97);border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px))}

.foot .pos{position:absolute;left:0;font-size:14px;color:var(--muted)}
.review{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rv{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:16px}
.rv .rt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rv h4{margin:0;font-size:17px}
.rv dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.rv dt{color:var(--muted)}.rv dd{margin:0;text-align:right}
.done-card{text-align:center;padding:48px 20px}
.done-card .ckm{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 12px;font-size:32px;color:#fff}
.hidden{display:none !important}
@media (max-width: 1100px){
  .steps{grid-template-columns:repeat(9,minmax(112px,1fr));overflow-x:auto}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srow{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width: 700px){
  .bar{padding:10px 14px}.steps{padding:0 14px 10px}main{padding:18px 14px 150px}
  .g2,.g3,.g4,.g5,.review,.srow{grid-template-columns:1fr}
  .ext{grid-template-columns:1fr 1fr}.ext .lab{grid-column:1/-1}
  .tier{grid-template-columns:32px 1fr}.tier .k{grid-column:2}
  .mrow{grid-template-columns:36px 1fr 1fr}.mrow .hd{display:none}
  .foot .pos{position:static}.foot .in{flex-wrap:wrap}
}
</style>
</head>

  // 1 お店

  }

  function mins(t){var a=String(t).split(":");return (+a[0])*60+(+a[1]||0)}
  function span(f,t){var a=mins(f),b=mins(t);if(b<=a)b+=1440;return [a,b]}
  function checks(){
    var W=[],biz=span(S.shop.open,S.shop.close);
    S.rules.forEach(function(r,i){
      var sp=span(r.from,r.to),a=sp[0],b=sp[1];if(a<biz[0]-60&&a+1440<=biz[1]){a+=1440;b+=1440}
      if(a<biz[0]||b>biz[1])W.push([2,"料金ルール「"+r.name+"」の時間（"+r.from+"〜"+r.to+"）が営業時間（"+S.shop.open+"〜"+S.shop.close+"）からはみ出しています"]);
      if(!r.days.length)W.push([2,"料金ルール「"+r.name+"」の曜日が選ばれていません"]);
      if(r.seat==="vip"&&S.seats.vip<1)W.push([2,"料金ルール「"+r.name+"」は VIP 席向けですが、VIP 席がありません"]);
      for(var j=i+1;j<S.rules.length;j++){var q=S.rules[j];
        if(q.seat===r.seat&&q.days.some(function(d){return r.days.indexOf(d)>=0})){var s2=span(q.from,q.to);if(s2[0]<sp[1]&&sp[0]<s2[1])W.push([2,"「"+r.name+"」と「"+q.name+"」の時間が重なっています（上のルールが優先されます）"])}}});
    if(S.vip.on&&S.seats.vip<1)W.push([1,"VIP 料金を使う設定ですが、VIP 席が 0 卓です"]);
    S.menu.forEach(function(c){if(!c.on)return;c.items.forEach(function(it){if(!it.on)return;
      if(!String(it.n).trim())W.push([3,c.cat+"に名前が空の商品があります"]);
      else if(!(+it.p>0))W.push([3,"「"+it.n+"」の値段が 0 円です"]);
      if(it.bt==="pct"&&+it.b>100)W.push([3,"「"+it.n+"」のバックが 100% を超えています"]);})});
    if(S.pay.slide!=="none"){for(var k=1;k<S.slideTiers.length;k++){if(+S.slideTiers[k][0]<=+S.slideTiers[k-1][0])W.push([4,"時給スライドの "+(k+1)+" 段目が前の段より小さい（昇順にしてください）"])}}
    if(+S.pay.trial<+S.pay.base)W.push([4,"体験入店の時給が基本時給より低くなっています"]);
    if((S.punch.how==="device"||(S.reg.castReg&&S.reg.castDev==="device"))&&!S.devReg)W.push([7,"打刻（またはキャストのレジ）を「店の端末だけ」にしていますが、店の端末が登録されていません"]);
    if(S.firstShift.from>S.firstShift.to)W.push([6,"最初のシフト期間の終了日が開始日より前です"]);
    return W;
  }

    box(5,"スタッフ",[["登録",S.staff.filter(function(s){return s.n}).length+" 人"]])+
    box(6,"シフト・勤怠",[["集め方",S.shift.mode==="want"?"シフト希望":"休み希望のみ"],["必要人数（日〜土）",S.shift.need.map(function(n,i){return S.shop.holidays.indexOf(["日","月","火","水","木","金","土"][i])>=0?0:n}).join("・")],["最初の期間",S.firstShift.from.slice(5).replace("-","/")+"〜"+S.firstShift.to.slice(5).replace("-","/")+(S.firstShift.start?"（完了時に募集開始）":"")],["打刻",{device:"店の端末だけ",geo:"位置情報",any:"どこからでも"}[S.punch.how]]])+
    box(7,"会計・レジ",[["キャストのレジ使用",r.castReg?"使う":"使わない"],["カード手数料",S.cardfee+"%"],["領収書",S.receipt.tno?"登録番号あり":"登録番号なし"],["店の端末",S.devReg?esc(S.devName):"未登録"],["釣銭準備金","¥"+yen(S.float)]])+'</div>';
  }
  function sDone(){
    var f=S.castForm,tab=S.castTab;
    var head='<section class="card done-card" style="padding:28px 20px"><div class="ckm" aria-hidden="true">✓</div><h2 style="margin:0 0 6px">初期設定が完了しました</h2><p class="note">続けてキャストを登録しましょう。あとからでも登録できます。</p>'+(S.firstShift.start?'<div class="info" style="margin-top:12px;text-align:left">シフト '+S.firstShift.from.slice(5).replace("-","/")+'〜'+S.firstShift.to.slice(5).replace("-","/")+' の希望の受付を始めました（締切 '+S.firstShift.due.slice(5).replace("-","/")+'）。招待したキャストから提出できます。</div>':'')+'</section>';
    var tabs='<div class="row" style="justify-content:center">'+seg("castTab",[["one","1 人ずつ登録"],["csv","CSV で一括登録"]],tab)+'</div>';
    var plans=["基本プラン","体験入店"];
    var one='<section class="card"><h3>キャストを 1 人ずつ登録</h3><div class="grid g3">'+
      '<label class="field"><span>源氏名（必須）</span>'+txt("castForm.g",f.g,"例：ひなの")+'</label>'+
      '<label class="field"><span>本名</span>'+txt("castForm.n",f.n,"支払調書・源泉に使います")+'</label>'+
      '<div class="field"><span>在籍区分</span>'+seg("castForm.st",[["在籍","在籍"],["体入","体験入店"]],f.st)+'</div>'+
      '<div class="field"><span>契約区分</span>'+seg("castForm.kind",[["業務委託","業務委託"],["雇用","雇用"]],f.kind)+'</div>'+
      '<label class="field"><span>待遇プラン</span><select data-path="castForm.plan">'+plans.map(function(p){return '<option'+(f.plan===p?" selected":"")+'>'+p+'</option>'}).join("")+'</select></label>'+
      '<label class="field"><span>電話</span>'+txt("castForm.tel",f.tel)+'</label>'+
      '<label class="field"><span>メール（ログインの招待に使います）</span>'+txt("castForm.mail",f.mail)+'</label>'+
      '<label class="field"><span>PIN（キオスク打刻・4 桁）</span>'+txt("castForm.pin",f.pin,"空なら自動で振ります")+'</label>'+
      '<label class="row" style="gap:10px;align-self:end;min-height:48px"><input type="checkbox" data-ck="castForm.invite"'+(f.invite?" checked":"")+' style="width:22px;height:22px"><span>メールがあれば招待を送る</span></label></div>'+
      '<p class="note">体験入店を選ぶと、待遇プランは「体験入店」（時給 ¥'+yen(S.pay.trial)+'・'+S.pay.trialDays+' 日）になります。</p>'+
      '<div class="row" style="justify-content:center"><button type="button" class="btn" data-addcast="1"'+(String(f.g).trim()?'':' disabled')+'>登録して次の人へ</button></div></section>';
    var csv='<section class="card"><h3>CSV で一括登録</h3><p class="lead">今の名簿を表計算ソフトで CSV にして取り込みます。1 行目は見出しです。</p>'+
      '<div class="field"><span>列（この順番）</span><div class="unit" style="padding:12px;font-family:ui-monospace,monospace;font-size:14px;display:block">源氏名,本名,在籍区分,契約区分,待遇プラン,電話,メール,PIN</div></div>'+
      '<p class="note">在籍区分＝在籍／体入、契約区分＝業務委託／雇用、待遇プラン＝基本プラン／体験入店（空なら在籍区分から自動）、PIN＝4 桁（空なら自動で振る）。メールがある人には招待を送ります。</p>'+
      '<div class="row" style="justify-content:center"><button type="button" class="btn3" data-copytpl="1">見出し行をコピー</button><label class="btn2" style="display:inline-flex;align-items:center;cursor:pointer">CSV ファイルを選ぶ<input type="file" accept=".csv,text/csv" id="csvFile" style="display:none"></label></div>'+
      (S.csvRows.length?'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr>'+["","源氏名","本名","在籍区分","契約区分","待遇プラン","電話","メール","PIN"].map(function(h){return '<th style="text-align:left;color:var(--muted);font-weight:400;padding:8px;border-bottom:1px solid var(--line)">'+h+'</th>'}).join("")+'</tr></thead><tbody>'+
        S.csvRows.map(function(r){return '<tr><td style="padding:8px;border-bottom:1px solid var(--line)">'+(r.err?'<span style="color:var(--warntext)">'+esc(r.err)+'</span>':'✓')+'</td>'+r.c.map(function(v){return '<td style="padding:8px;border-bottom:1px solid var(--line)">'+esc(v)+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'+
        '<div class="row" style="justify-content:center"><button type="button" class="btn" data-importcsv="1">'+S.csvRows.filter(function(r){return !r.err}).length+' 人を登録する</button></div>':'')+'</section>';
    var list='<section class="card"><h3>登録したキャスト（'+S.casts.length+' 人）</h3>'+(S.casts.length?'<div class="chips">'+S.casts.map(function(c){return '<span class="chip">'+esc(c.g)+'・'+c.st+'・'+c.kind+'・PIN '+c.pin+(c.inv?'・招待済み':'')+'</span>'}).join("")+'</div>':'<p class="note">まだいません。</p>')+
      '<div class="row" style="justify-content:center"><button type="button" class="btn3" data-go="0">設定を見直す</button>'+(S.casts.length?'<button type="button" class="btn3" data-printpin="1">PIN の一覧を印刷</button>':'')+'<button type="button" class="btn2">ホームへ</button></div></section>';
    return head+tabs+(tab==="one"?one:csv)+list;
  }
  function genPin(){var used=S.casts.map(function(c){return c.pin}).concat(S.staff.map(function(x){return x.pin}));var p;do{p=String(Math.floor(1000+Math.random()*9000))}while(used.indexOf(p)>=0);return p}
  function parseCsv(text){var lines=text.replace(/\r/g,"").split("\n").filter(function(l){return l.trim()});if(!lines.length)return[];
    if(/源氏名/.test(lines[0]))lines.shift();
    return lines.map(function(l){var c=[],cur="",q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){q=!q;continue}if(ch===","&&!q){c.push(cur);cur="";continue}cur+=ch}c.push(cur);
      while(c.length<8)c.push("");c=c.slice(0,8).map(function(v){return v.trim()});
      if(!c[2])c[2]="在籍";if(!c[3])c[3]="業務委託";if(!c[4])c[4]=c[2]==="体入"?"体験入店":"基本プラン";
      var err=!c[0]?"源氏名が空":(["在籍","体入"].indexOf(c[2])<0?"在籍区分が不正":(["業務委託","雇用"].indexOf(c[3])<0?"契約区分が不正":""));if(!err&&c[7]&&!/^\d{4}$/.test(c[7]))err="PIN は 4 桁の数字";
      return {c:c,err:err}})}

  var VIEWS=[s1,s2,s3,s4,s5,s6,s7,s8,s9];
  function renderSteps(){
    $("steps").innerHTML=STEPS.map(function(n,i){var cur=S.step===i,done=S.done[i]&&!cur;
      return '<li><button type="button" data-step="'+i+'" class="'+(done?"done":"")+'"'+(cur?' aria-current="step"':'')+(i>0&&!S.type?' disabled style="opacity:.5"':'')+'><span class="n">'+(done?"✓":(i+1))+'</span><span class="t">'+n+'</span></button></li>'}).join("");
  }
  function render(){
    renderSteps();
    $("main").innerHTML=S.step===9?sDone():VIEWS[S.step]();
    $("foot").classList.toggle("hidden",S.step===9);
    $("pos").textContent=(S.step+1)+" / "+STEPS.length;
    $("back").style.visibility=S.step===0?"hidden":"visible";
    $("next").textContent=S.step===8?"この内容で始める":"次へ："+STEPS[S.step+1];
    $("next").disabled=S.step===0&&!S.type;
  }
  function go(i){S.step=i;render();window.scrollTo({top:0,behavior:"smooth"})}
  function getObj(path){var k=path.split("."),o=S;for(var i=0;i<k.length-1;i++)o=o[k[i]];return [o,k[k.length-1]]}
  function setPath(path,v){var a=getObj(path);a[0][a[1]]=v}
  function flash(){S.dirty=true;var s=$("saved");s.textContent="保存しました";clearTimeout(flash.t);flash.t=setTimeout(function(){s.textContent="入力は自動で保存されます"},1200)}
  function rebuildBack(){var b=S.back;S.menu.forEach(function(c){var rate=/キャスト|ママ|ショット/.test(c.cat)?b.drink:(/シャンパン|スパークリング|ボトル|ウイスキー|焼酎/.test(c.cat)?b.bottle:0);
    c.items.forEach(function(it){if(/キャスト|ママ|ショット/.test(c.cat)||it.keep||/シャンパン|スパークリング/.test(c.cat))it.b=it.bt==="pct"?rate:Math.round(it.p*rate/100)})})}

  $("steps").addEventListener("click",function(e){var b=e.target.closest("button[data-step]");if(!b||b.disabled)return;go(+b.dataset.step)});
  $("back").addEventListener("click",function(){if(S.step>0)go(S.step-1)});
  $("next").addEventListener("click",function(){S.done[S.step]=true;go(S.step+1)});
  $("main").addEventListener("input",function(e){var t=e.target;if(!t.dataset.path)return;setPath(t.dataset.path,t.type==="number"?Number(t.value):t.value);flash();
    if(/^seats\./.test(t.dataset.path)){clearTimeout(render.t);render.t=setTimeout(function(){var pos=t.dataset.path,c=t.selectionStart;render();var el=document.querySelector('[data-path="'+pos+'"]');if(el){el.focus()}},400)}});
  $("main").addEventListener("change",function(e){var t=e.target;
    if(t.id==="csvFile"&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){S.csvRows=parseCsv(String(rd.result));render()};rd.readAsText(t.files[0],"UTF-8");return}
    if(t.dataset.path==="castForm.g"){render();return}
    if(t.dataset.path&&t.tagName==="SELECT"){setPath(t.dataset.path,t.value);flash();if(/\.bt$/.test(t.dataset.path))render()}
    if(t.dataset.ck){setPath(t.dataset.ck,t.checked);flash();render()}
    if(t.dataset.def){var a=t.dataset.def.split("."),rule=S.rules[+a[0]];rule.ext.forEach(function(x,j){x[2]=j===+a[1]?1:0});flash()}});
  $("main").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.hol){var h=S.shop.holidays,hi=h.indexOf(b.dataset.hol);if(hi>=0)h.splice(hi,1);else h.push(b.dataset.hol);flash();render();return}
    if(b.dataset.type){var nt=b.dataset.type,nm=TYPES.filter(function(x){return x.id===nt})[0].name;
      if(S.type&&S.type!==nt&&S.dirty){if(confirm("入力した席・料金・メニュー・待遇を「"+nm+"」の初期値に入れ替えますか？\nキャンセルすると、入力はそのままで業態だけ「"+nm+"」になります。")){applyType(nt);S.dirty=false}else{S.type=nt}}
      else{applyType(nt);S.dirty=false}
      render();return}
    if(b.dataset.rday){var rd=b.dataset.rday.split("."),rl=S.rules[+rd[0]],di=rl.days.indexOf(rd[1]);if(di>=0)rl.days.splice(di,1);else rl.days.push(rd[1]);flash();render();return}
    if(b.dataset.docopy){applyType("cabaret");S.copied=true;S.shop.name="";S.shop.addr="";if(!S.copyWhat.seats){S.seats.counter=0;S.seats.table=0;S.seats.vip=0}if(!S.copyWhat.staff)S.staff=[];
      if(!S.copyWhat.menu)S.menu=[];S.dirty=false;render();return}
    if(b.dataset.addcast){var f=S.castForm;if(!String(f.g).trim())return;S.casts.push({g:f.g,st:f.st,kind:f.kind,pin:/^\d{4}$/.test(f.pin)?f.pin:genPin(),inv:!!(f.invite&&String(f.mail).trim())});S.castForm={g:"",n:"",st:"在籍",kind:f.kind,plan:"基本プラン",tel:"",mail:"",pin:"",invite:f.invite};render();var el=document.querySelector('[data-path="castForm.g"]');if(el)el.focus();return}
    if(b.dataset.copytpl){try{navigator.clipboard.writeText("源氏名,本名,在籍区分,契約区分,待遇プラン,電話,メール,PIN");b.textContent="コピーしました"}catch(err){b.textContent="コピーできませんでした"}return}
    if(b.dataset.importcsv){S.csvRows.filter(function(r){return !r.err}).forEach(function(r){S.casts.push({g:r.c[0],st:r.c[2],kind:r.c[3],pin:r.c[7]||genPin(),inv:!!r.c[6]})});S.csvRows=[];render();return}
    if(b.dataset.go){go(+b.dataset.go);return}
    var sg=b.closest("[data-seg]");
    if(sg){var key=sg.dataset.seg,v=b.dataset.v;
      if(v==="on"||v==="off")v=v==="on";else if(/^\d+$/.test(v))v=+v;
      setPath(key,v);
      if(key==="pay.slide")S.slideTiers=v==="point"?[[10,3500],[20,4000],[30,4500],[50,5000]]:[[800000,3000],[1200000,3500],[1600000,4500]];
      flash();render();return}
    if(b.dataset.delrule){if(S.rules.length>1&&confirm(S.rules[+b.dataset.delrule].name+" を削除しますか？")){S.rules.splice(+b.dataset.delrule,1);render()}return}
    if(b.dataset.delext){var de=b.dataset.delext.split("."),rr=S.rules[+de[0]],wd=rr.ext[+de[1]][2];rr.ext.splice(+de[1],1);if(wd&&rr.ext.length)rr.ext[0][2]=1;render();return}
    if(b.dataset.addext){var r=S.rules[+b.dataset.addext];r.ext.push([60,r.set,0]);render();return}
    if(b.dataset.addrule){S.rules.push(normRule(R("新しいルール","",S.rules[0]?S.rules[0].set:5000,60,[[30,2500,1]])));render();return}
    if(b.dataset.addtier){var last=S.slideTiers[S.slideTiers.length-1]||[0,S.pay.base];S.slideTiers.push([Math.round(last[0]*1.25),last[1]+500]);render();return}
    if(b.dataset.deltier){if(S.slideTiers.length>1){S.slideTiers.splice(+b.dataset.deltier,1);render()}return}
    if(b.dataset.additem){S.menu[+b.dataset.additem].items.push({n:"",p:0,b:0,keep:false,on:true});render();return}
    if(b.dataset.delitem){var di=b.dataset.delitem.split(".");S.menu[+di[0]].items.splice(+di[1],1);render();return}
    if(b.dataset.addcat){var nm=($("newCat").value||"").trim();if(!nm)return;S.menu.push({cat:nm,on:true,items:[{n:"",p:0,b:0,keep:false,on:true}]});render();return}
    if(b.dataset.reback){rebuildBack();flash();var t=b.textContent;b.textContent="メニューのバックを入れ直しました";setTimeout(function(){b.textContent=t},1500);return}
    if(b.dataset.devreg){S.devReg=!S.devReg;flash();render();return}
    if(b.dataset.printpin){window.print();return}
    if(b.dataset.addstaff){S.staff.push({n:"",role:"黒服",kind:"アルバイト",basis:"時給",amt:1500,pin:""});render();return}
    if(b.dataset.delstaff){S.staff.splice(+b.dataset.delstaff,1);render();return}
  });
  render();
})();
</script>
</body>
</html>
