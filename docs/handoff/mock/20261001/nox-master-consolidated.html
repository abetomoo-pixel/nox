<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NOX｜マスタ整理案</title>
<style>
:root{
 --bg:#090a0c;--side:#0e0f11;--panel:#141518;--panel2:#191b1f;
 --ink:#f0f1f3;--muted:#a6aab2;--quiet:#777d88;--line:#2b2e35;
 --brand:#c6ad74;--brand-bg:#211e17;--primary:#77b8ff;--primary-bg:#152336;
 --danger:#f48e88;--danger-bg:#31201f;--success:#80c5a2;
 --radius:12px;--side-width:212px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:14px;line-height:1.65}
button,input{font:inherit}
button,a,input{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
a{color:inherit;text-decoration:none}
button{color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
[hidden]{display:none!important}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side-width);background:var(--side);border-right:1px solid var(--line);padding:24px 14px 14px;display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 10px 22px}
.brand-mark{width:34px;height:36px;border:1px solid var(--brand);border-radius:8px;display:grid;place-items:center;color:var(--brand);font:23px Georgia,serif}
.brand-name{font-size:17px;font-weight:750;letter-spacing:1.3px;line-height:1.3}
.brand-caption{font-size:9px;color:var(--muted);letter-spacing:2px}
.nav-group{border-bottom:1px solid var(--line);padding:10px 0}
.nav-group:last-of-type{border-bottom:0}
.nav-label{font-size:10px;letter-spacing:.13em;color:var(--quiet);padding:1px 12px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;min-height:38px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:600;color:#c6c9cf;width:100%;text-align:left;background:none}
.nav-item svg{width:17px;height:17px;color:var(--muted)}
a.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary)}
.nav-item.active svg{color:var(--primary)}
.nav-badge{margin-left:auto;background:var(--danger-bg);color:var(--danger);border-radius:5px;min-width:20px;text-align:center;font-size:10px;padding:0 5px}
.sidebar-bottom{margin-top:auto;padding:24px 12px 4px;color:var(--quiet);font-size:10px;letter-spacing:.04em}
.shell{margin-left:var(--side-width)}
.topbar{height:61px;display:flex;justify-content:space-between;align-items:center;padding:0 36px;border-bottom:1px solid var(--line);background:rgba(9,10,12,.94)}
.topbar-store{color:var(--muted);font-size:11px;letter-spacing:.16em}
.topbar-actions{display:flex;align-items:center;gap:12px}
.preview-badge{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
.owner{font-size:11px;display:flex;align-items:center;gap:7px;color:#d9dce2}
.owner-dot{width:24px;height:24px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
.owner-dot svg{width:13px;height:13px}
.gear-link{width:28px;height:28px;display:grid;place-items:center;color:var(--primary)}
.gear-link svg{width:18px;height:18px}
main{max-width:1220px;margin:0 auto;padding:33px 36px 26px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:28px;margin-bottom:26px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.19em;color:var(--brand);margin-bottom:4px}
h1{font-size:26px;line-height:1.45;margin:0 0 6px;font-weight:750;letter-spacing:.02em}
.page-description{color:var(--muted);font-size:12px;margin:0}
.search-wrap{position:relative;width:350px;flex-shrink:0}
.search-wrap>svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search-wrap input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:43px;color:var(--ink);padding:9px 41px 9px 39px;font-size:12px}
.search-wrap input::placeholder{color:#969ca7}
.clear-search{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:29px;height:29px;display:grid;place-items:center;background:none;border:0;border-radius:5px;color:var(--muted)}
.clear-search:hover{background:var(--panel2)}
.clear-search svg{width:15px;height:15px}
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.setting-group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.group-head{display:flex;align-items:center;gap:12px;padding:19px 21px 16px}
.group-icon{width:35px;height:35px;display:grid;place-items:center;color:var(--brand);background:var(--brand-bg);border:1px solid #3c3424;border-radius:9px}
.group-icon svg{width:19px;height:19px}
.group-title h2{margin:0;font-size:16px;font-weight:700;line-height:1.5}
.group-title p{margin:3px 0 0;color:var(--muted);font-size:11px}
.group-index{margin-left:auto;font-size:10px;letter-spacing:.09em;font-variant-numeric:tabular-nums;color:var(--quiet);align-self:flex-start;padding-top:2px}
.group-items{padding:0 11px 10px}
.setting-link{position:relative;display:flex;align-items:center;gap:16px;padding:14px 11px;border-top:1px solid var(--line);min-height:76px;border-radius:0}
.setting-link:hover{background:#1b2028;border-radius:7px}
.setting-link:focus-visible{outline-offset:-2px;border-radius:7px}
.link-copy{flex:1;min-width:0}
.link-title{font-size:14px;font-weight:700;display:block;margin-bottom:3px}
.link-desc{color:var(--muted);font-size:11px;display:block;line-height:1.7}
.link-aside{display:flex;align-items:center;gap:12px;flex-shrink:0}
.link-meta{font-size:10px;color:var(--quiet);text-align:right;line-height:1.6;white-space:nowrap}
.link-chevron{color:var(--primary);width:16px;height:16px;transition:transform .15s}
.setting-link:hover .link-chevron{transform:translateX(3px)}
.group-note{margin:0 22px 16px;display:flex;align-items:center;gap:7px;font-size:10px;color:var(--quiet)}
.group-note svg{width:13px;height:13px}
.overview-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:21px}
.footer-note{color:var(--quiet);font-size:11px;margin:0}
.footer-note a{color:var(--primary)}
.text-button{display:inline-flex;align-items:center;gap:5px;padding:4px 0;color:var(--primary);background:none;border:0;font-size:11px;white-space:nowrap}
.text-button svg{width:14px;height:14px}
.under-note{margin:24px 0 0;border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;color:var(--quiet);font-size:10px;gap:16px}
.search-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;color:var(--muted);font-size:12px}
.search-head strong{color:var(--ink);font-weight:600}
.search-list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 20px}
.search-result{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.search-result:last-child{border-bottom:0}
.search-result:hover .result-title{color:var(--primary)}
.result-body{flex:1;min-width:0}
.result-path{font-size:10px;color:var(--quiet);margin-bottom:5px}
.result-title{font-size:15px;font-weight:700}
.result-description{font-size:12px;color:var(--muted);margin-top:5px}
.result-chevron{color:var(--primary);width:16px;height:16px}
.empty-search{text-align:center;padding:60px 20px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px}
.empty-search strong{display:block;color:var(--ink);margin-bottom:8px}
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--muted);margin:0 0 23px}
.breadcrumb a{color:var(--primary)}
.breadcrumb svg{width:12px;height:12px;color:var(--quiet)}
.detail-titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:25px}
.detail-titlebar .page-description{max-width:790px;line-height:1.9}
.outline-button{display:flex;align-items:center;gap:7px;padding:9px 14px;white-space:nowrap;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--primary);font-size:12px}
.outline-button svg{width:15px;height:15px}
.tablist{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;white-space:nowrap;padding:11px 18px 13px;color:var(--muted);font-weight:600;font-size:13px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{background:var(--panel)}
.detail-body{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:23px 26px}
.detail-body-heading{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:8px}
.detail-body-heading h2{font-size:16px;font-weight:700;margin:0}
.placement-tag{font-size:10px;color:var(--quiet);border:1px solid var(--line);padding:2px 6px;border-radius:4px;white-space:nowrap}
.field-row{display:grid;grid-template-columns:minmax(155px,.65fr) 2fr;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}
.field-row:last-child{border-bottom:0}
.field-label{font-size:13px;font-weight:650}
.field-description{font-size:12px;color:var(--muted);line-height:1.9}
.detail-note{padding:16px 19px;margin-top:18px;background:var(--primary-bg);border:1px solid #2a3d55;border-radius:8px;color:#c2d5eb;font-size:12px;display:flex;align-items:flex-start;gap:10px}
.detail-note svg{width:16px;height:16px;margin-top:2px;color:var(--primary)}
.related{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:12px}
.related>span{color:var(--quiet);font-size:11px}
.related a{color:var(--primary);display:flex;align-items:center;gap:5px}
.related svg{width:14px;height:14px}
.source-details{border-top:1px solid var(--line);margin-top:29px;padding-top:15px}
.source-details summary{cursor:pointer;color:var(--quiet);font-size:11px}
.source-details ul{padding-left:22px;color:var(--muted);font-size:11px}
.source-details code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
.modal{color:var(--ink);background:var(--panel);border:1px solid #414651;border-radius:14px;padding:0;width:min(860px,calc(100% - 32px));max-height:86vh}
.modal::backdrop{background:rgba(0,0,0,.76);backdrop-filter:blur(3px)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 25px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal-head h2{margin:0;font-size:20px}
.close-modal{border:1px solid var(--line);background:var(--panel2);border-radius:7px;display:grid;place-items:center;width:34px;height:34px;color:var(--muted)}
.modal-body{padding:22px 25px}
.modal-description{font-size:12px;color:var(--muted);margin:0 0 20px}
.change-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:23px}
.change-stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:15px}
.change-stat small{display:block;color:var(--muted);font-size:11px}
.change-stat strong{font-size:24px;line-height:1.5;color:var(--ink)}
.change-stat em{font-size:11px;font-style:normal;color:var(--quiet)}
.mapping-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}
.mapping-table th{color:var(--muted);font-weight:600;padding:12px 10px;background:var(--panel2)}
.mapping-table td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.mapping-table td small{display:block;color:var(--quiet);font-size:10px;margin-top:3px}
.mapping-table td a{color:var(--primary)}
.implementation-note{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.95}
.mobile-brand,.mobile-nav{display:none}
@media(min-width:1500px){main{padding-top:42px}.setting-link{min-height:80px}.group-head{padding-top:23px;padding-bottom:20px}}
@media(max-width:1200px){
 :root{--side-width:188px}main{padding-left:27px;padding-right:27px}
 .topbar{padding:0 27px}.search-wrap{width:300px}.link-meta{font-size:9px}
 .setting-link{gap:8px}.link-aside{gap:7px}.group-head{padding-left:20px;padding-right:20px}
 .pagehead{gap:20px}.page-description{font-size:11px}
}
@media(max-width:1050px){
 .group-grid{gap:14px}.link-meta{display:none}.search-wrap{width:280px}
 .pagehead{align-items:flex-start}.pagehead .page-description{max-width:350px}.group-title h2{font-size:15px}
}
@media(max-width:860px){
 :root{--side-width:0px}.sidebar{display:none}.topbar{height:59px;padding:0 22px;position:sticky;top:0;z-index:15}
 .topbar-store{display:none}.mobile-brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.08em}
 .mobile-brand .brand-mark{width:25px;height:27px;border-radius:6px;font-size:18px}.owner{font-size:10px}
 main{padding:25px 22px 90px}.link-meta{display:block}.group-grid{gap:16px}.group-head{padding:18px}
 .setting-link{padding:13px 9px}.group-items{padding:0 9px 9px}.link-title{font-size:13px}
 .link-desc{font-size:10px}.group-title p{font-size:10px}.group-icon{width:32px;height:32px}
 .search-wrap{width:280px}.pagehead{gap:16px}.topbar-actions{gap:9px}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:#111317;border-top:1px solid var(--line);padding:7px 15px max(7px,env(safe-area-inset-bottom))}
 .mobile-nav>a,.mobile-nav>span{display:flex;flex:1;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);padding:3px 0}
 .mobile-nav .active{color:var(--primary)}.mobile-nav svg{width:19px;height:19px}
}
@media(max-width:650px){
 .pagehead{display:block;margin-bottom:21px}.search-wrap{width:100%;margin-top:18px}
 .group-grid{grid-template-columns:1fr;gap:14px}.group-head{padding:17px 19px 14px}
 .group-title h2{font-size:16px}.group-title p{font-size:11px}.group-icon{width:34px;height:34px}
 .group-items{padding:0 10px 8px}.setting-link{padding:14px 10px;min-height:74px}.link-title{font-size:14px}.link-desc{font-size:11px}
 .link-meta{font-size:10px}.topbar{padding:0 18px}.preview-badge{font-size:9px}.gear-link{display:none}
 main{padding:25px 16px 91px}h1{font-size:25px}.pagehead .page-description{max-width:none;font-size:12px}
 .overview-footer{display:block;margin-top:18px}.footer-note{font-size:10px;line-height:1.9}.overview-footer .text-button{margin-top:12px}
 .under-note{display:block;font-size:9px;margin-top:16px;padding-top:13px}.under-note span{display:block;margin-top:4px}
 .breadcrumb{font-size:10px;margin-bottom:20px;gap:5px}.detail-titlebar{display:block;margin-bottom:18px}
 .detail-titlebar .outline-button{margin-top:15px;display:inline-flex}.detail-titlebar .page-description{font-size:12px}
 .tablist{margin-left:-1px;margin-right:-1px;gap:0}.tab{font-size:12px;padding:10px 14px 12px}
 .detail-body{padding:18px}.detail-body-heading{display:block}.placement-tag{display:inline-block;margin-top:8px}
 .field-row{display:block;padding:17px 0}.field-description{margin-top:7px;font-size:12px}.field-label{font-size:13px}
 .detail-note{font-size:11px;padding:14px}.related{gap:10px;align-items:flex-start;flex-direction:column}
 .source-details{margin-top:24px}.modal-head{padding:18px}.modal-head h2{font-size:18px}.modal-body{padding:18px}
 .change-stats{gap:7px}.change-stat{padding:10px}.change-stat small{font-size:9px}.change-stat strong{font-size:21px}.change-stat em{font-size:9px;display:block}
 .mapping-table{font-size:10px}.mapping-table td,.mapping-table th{padding:10px 7px}.mapping-table td small{font-size:9px}
 .search-list{padding:0 16px}.result-description{font-size:11px}.result-title{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
 .sidebar,.topbar,.mobile-nav,.search-wrap,.overview-footer,.under-note,.source-details{display:none!important}
 .shell{margin:0}main{padding:0}body{background:#fff;color:#111}
 :root{--panel:#fff;--ink:#111;--muted:#444;--quiet:#666;--line:#ccc}
 .setting-group{break-inside:avoid}.link-chevron{display:none}
}
</style>
</head>
<body>
<aside class="sidebar" aria-label="メインメニュー">
 <a class="brand" href="#/overview" aria-label="NOX マスタ">
  <span class="brand-mark">N</span><span><span class="brand-name">NOX</span><br><span class="brand-caption">CLUB NOX</span></span>
 </a>
 <div id="desktop-nav"></div>
 <div class="sidebar-bottom">NOX · STORE MANAGEMENT</div>
</aside>
<div class="shell">
 <header class="topbar">
  <span class="topbar-store">CLUB NOX</span>
  <a class="mobile-brand" href="#/overview"><span class="brand-mark">N</span>NOX</a>
  <div class="topbar-actions">
   <span class="preview-badge">構成プレビュー</span>
   <a class="gear-link" href="#/overview" aria-label="マスタトップへ" id="gear-icon"></a>
   <span class="owner"><span class="owner-dot" id="owner-icon"></span>オーナー</span>
  </div>
 </header>
 <main id="main">
  <section id="overview" aria-label="マスタトップ">
   <div class="pagehead">
    <div><div class="eyebrow">MASTER SETTINGS</div><h1>マスタ</h1><p class="page-description">商品・料金、報酬、店舗運用、端末の設定を管理します。</p></div>
    <div class="search-wrap">
     <span id="search-icon"></span>
     <input type="search" id="settings-search" autocomplete="off" aria-label="設定を検索" placeholder="設定を検索（商品・バック・端末など）">
     <button type="button" class="clear-search" id="clear-search" aria-label="検索をクリア" hidden></button>
    </div>
   </div>
   <div class="group-grid" id="group-grid"></div>
   <section id="search-results" aria-label="設定の検索結果" hidden></section>
   <div class="overview-footer" id="overview-footer">
    <p class="footer-note">入出庫や在庫履歴の確認は、営業メニューの <a href="#/stock/records">在庫</a> から。</p>
    <button type="button" class="text-button compare-trigger">統合前後を確認 <span class="arrow-icon"></span></button>
   </div>
  </section>
  <section id="detail" aria-label="設定の構成プレビュー" hidden></section>
  <footer class="under-note"><span>構成確認用のHTMLです。設定値の保存・更新は行いません。</span><span>トップの件数はご提供画面の表示例です。</span></footer>
 </main>
</div>
<nav class="mobile-nav" aria-label="モバイルメニュー" id="mobile-nav"></nav>
<dialog class="modal" id="comparison-dialog" aria-labelledby="comparison-title">
 <div class="modal-head"><h2 id="comparison-title">マスタの整理内容</h2><button type="button" class="close-modal" id="close-modal" aria-label="閉じる"></button></div>

$("#mobile-nav").innerHTML = `<span>${icon("home")}ホーム</span><span>${icon("receipt")}レジ</span><span>${icon("document")}日報</span><span>${icon("calendar")}シフト</span><a href="#/overview" data-nav="overview">${icon("menu")}メニュー</a>`;
$("#gear-icon").innerHTML=icon("sliders");
$("#owner-icon").innerHTML=icon("user");
$("#search-icon").outerHTML=icon("search");
$("#clear-search").innerHTML=icon("cross");
$("#close-modal").innerHTML=icon("cross");
document.querySelectorAll(".arrow-icon").forEach(e=>e.outerHTML=icon("arrow"));
function renderOverview(){
 $("#group-grid").innerHTML=DATA.groups.map((g,index)=>`<section class="setting-group" aria-labelledby="group-${g.id}">
  <div class="group-head"><span class="group-icon">${icon(g.icon)}</span><div class="group-title"><h2 id="group-${g.id}">${esc(g.title)}</h2><p>${esc(g.description)}</p></div><span class="group-index">${String(index+1).padStart(2,"0")}</span></div>
  <div class="group-items">${g.pages.map(id=>{
    const p=byId[id];
    return `<a class="setting-link" href="#/${p.id}/${p.tabs[0].id}"><span class="link-copy"><span class="link-title">${esc(p.title)}</span><span class="link-desc">${esc(p.subtitle)}</span></span><span class="link-aside">${p.meta?`<span class="link-meta">${esc(p.meta)}</span>`:""}${icon("chevron","link-chevron")}</span></a>`;
  }).join("")}</div>
  ${g.id==="system"?`<p class="group-note">${icon("lock")}機密・税務情報は、権限に応じた保護画面で管理</p>`:""}
 </section>`).join("");
}

function renderDetail(p,tabId,focusTitle=false){
 const tab=p.tabs.find(t=>t.id===tabId)||p.tabs[0];
 $("#detail").innerHTML=`<nav class="breadcrumb" aria-label="パンくず"><a href="#/overview">マスタ</a>${icon("chevron")}<span>${esc(p.group)}</span>${icon("chevron")}<span>${esc(p.title)}</span></nav>
  <div class="detail-titlebar"><div><div class="eyebrow">${p.id==="stock"?"DAILY OPERATIONS":"MASTER SETTINGS"}</div><h1 id="detail-title" tabindex="-1">${esc(p.title)}</h1><p class="page-description">${esc(p.description)}</p></div><a class="outline-button" href="#/overview">${icon("back")}マスタに戻る</a></div>
  ${p.tabs.length>1?`<div class="tablist" role="tablist" aria-label="${esc(p.title)}の設定">${p.tabs.map(t=>`<button type="button" role="tab" class="tab ${t.id===tab.id?"active":""}" id="tab-${t.id}" aria-selected="${t.id===tab.id}" tabindex="${t.id===tab.id?"0":"-1"}" aria-controls="tab-panel" data-tab="${t.id}">${esc(t.title)}</button>`).join("")}</div>`:""}
  <section class="detail-body" id="tab-panel" ${p.tabs.length>1?`role="tabpanel" aria-labelledby="tab-${tab.id}"`:`aria-label="${esc(tab.title)}"`}>
   <div class="detail-body-heading"><h2>${esc(tab.title)}</h2><span class="placement-tag">設定項目の配置プレビュー</span></div>
   ${tab.fields.map(([label,description])=>`<div class="field-row"><div class="field-label">${esc(label)}</div><div class="field-description">${esc(description)}</div></div>`).join("")}
  </section>
  ${tab.note?`<div class="detail-note">${icon("info")}<span>${esc(tab.note)}</span></div>`:""}
  ${p.related?`<div class="related"><span>関連する設定</span>${p.related.map(r=>`<a href="#/${r.target}">${esc(r.label)}${icon("arrow")}</a>`).join("")}</div>`:""}
  <details class="source-details"><summary>既存画面との対応を確認</summary><ul>${tab.source.map(path=>{
    const source=DATA.sources.find(s=>s.path===path);
    return `<li>${source?esc(source.title):""}<br><code>${esc(path)}</code></li>`;
  }).join("")}</ul><p class="footer-note">画面の入口・タブを整理する案です。元の設定値、計算、権限、履歴を変更するものではありません。</p></details>`;
 $("#detail").querySelectorAll("[data-tab]").forEach(btn=>{
   btn.addEventListener("click",()=>{location.hash=`/${p.id}/${btn.dataset.tab}`;});
   btn.addEventListener("keydown",event=>{
     const keys=["ArrowRight","ArrowLeft","Home","End"];
     if(!keys.includes(event.key))return;
     event.preventDefault();
     let idx=p.tabs.findIndex(t=>t.id===tab.id);
     if(event.key==="Home") idx=0;
     else if(event.key==="End") idx=p.tabs.length-1;
     else idx=(idx+(event.key==="ArrowRight"?1:-1)+p.tabs.length)%p.tabs.length;
     location.hash=`/${p.id}/${p.tabs[idx].id}`;
     requestAnimationFrame(()=>document.getElementById(`tab-${p.tabs[idx].id}`)?.focus());
   });
 });
 document.title=`NOX｜${p.title}｜マスタ整理案`;
 if(focusTitle)$("#detail-title").focus({preventScroll:true});
}

const searchDocs = [];
for(const p of DATA.pages){
 for(const t of p.tabs){
  const matching=DATA.sources.filter(s => t.source.includes(s.path));
  searchDocs.push({
   target:`${p.id}/${t.id}`,
   title:t.title===p.title?p.title:`${p.title} / ${t.title}`,
   path:`${p.group} › ${p.title}`,
   description:t.fields.map(f=>f[0]).join("・"),
   text:[p.title,p.subtitle,t.title,...t.fields.flat(),...matching.flatMap(s=>[s.title,s.description])].join(" ")
  });
 }
}
searchDocs.push({target:"stock/records",title:"在庫",path:"営業メニュー",description:"入出庫・在庫履歴。マスタトップから営業メニューに整理。",text:"在庫 入出庫 発注 発注推奨 在庫履歴 補充"});
function normalize(s){return s.normalize("NFKC").toLocaleLowerCase("ja").replace(/\s+/g," ").trim();}
function updateSearch(){
 const q=$("#settings-search").value;
 const terms=normalize(q).split(" ").filter(Boolean);
 const searching=terms.length>0;
 $("#clear-search").hidden=!searching;
 $("#group-grid").hidden=searching;
 $("#overview-footer").hidden=searching;
 $("#search-results").hidden=!searching;
 if(!searching)return;
 const hits=searchDocs.filter(s=>terms.every(t=>normalize(s.text).includes(t)));
 $("#search-results").innerHTML=`<div class="search-head" role="status" aria-live="polite"><span><strong>「${esc(q)}」</strong> の検索結果</span><span>${hits.length}件</span></div>`+
 (hits.length?`<div class="search-list">${hits.map(s=>`<a class="search-result" href="#/${s.target}"><span class="result-body"><span class="result-path">${esc(s.path)}</span><br><span class="result-title">${esc(s.title)}</span><span class="result-description" style="display:block">${esc(s.description)}</span></span>${icon("chevron","result-chevron")}</a>`).join("")}</div>`:`<div class="empty-search"><strong>該当する設定がありません</strong>「商品」「ノルマ」「店舗情報」など、別の設定名で検索してください。</div>`);
}
$("#settings-search").addEventListener("input",updateSearch);
$("#clear-search").addEventListener("click",()=>{$("#settings-search").value="";updateSearch();$("#settings-search").focus();});
$("#settings-search").addEventListener("keydown",e=>{if(e.key==="Escape"){$("#settings-search").value="";updateSearch();}});
let lastPage="";
function route(){
 const parts=decodeURIComponent(location.hash.replace(/^#\/?/,"")).split("/");
 const id=parts[0]||"overview", requestedTab=parts[1];
 const isOverview=id==="overview"||!byId[id];
 const p=byId[id];
 const samePage=lastPage===id;
 $("#overview").hidden=!isOverview;
 $("#detail").hidden=isOverview;
 document.querySelectorAll("[data-nav]").forEach(a=>{
   const active=id==="stock"?a.dataset.nav==="stock/records":a.dataset.nav==="overview";
   a.classList.toggle("active",active);
   if(active)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
 });
 if(isOverview){document.title="NOX｜マスタ整理案";updateSearch();}
 else{renderDetail(p,requestedTab,!samePage);if(samePage)document.getElementById(`tab-${requestedTab}`)?.focus({preventScroll:true});}
 if(!samePage)window.scrollTo({top:0,behavior:"instant"});
 lastPage=id;
}
function makeComparison(){
 $("#comparison-body").innerHTML=`
 <p class="modal-description">4分類の順序はそのままに、関連する設定をタブ化。商品数などの大型集計カードと在庫の警告帯は、トップから外します。</p>
 <div class="change-stats"><div class="change-stat"><small>トップの独立した入口</small><strong>17 → 9</strong><br><em>関連設定を統合</em></div><div class="change-stat"><small>大きなカード</small><strong>17 → 4</strong><br><em>4つの分類パネル</em></div><div class="change-stat"><small>設定の項目</small><strong>削除なし</strong><br><em>入口と配置だけを整理</em></div></div>
 <table class="mapping-table"><thead><tr><th>現在の入口</th><th>整理後の配置</th></tr></thead><tbody>${DATA.sources.map(s=>{
  const d=DATA.destinations[s.path];
  return `<tr><td>${esc(s.title)}<small>${esc(s.group)}</small></td><td><a class="mapping-link" href="#/${d[2]}">${esc(d[0])}</a><small>${esc(d[1])}</small></td></tr>`;
 }).join("")}</tbody></table>
 <div class="implementation-note"><strong>実装時に維持するもの</strong><br>利用する／しないは「利用機能」、金額・率・計算条件は各マスタへ。会社の既定と店舗別上書き、オーナー限定操作、機密情報の閲覧権限・ログは維持します。OFFにしても既存データは削除しません。<br><br>既存の編集画面をタブ内に配置し、従来のURLは直接アクセスできるように残す構成です。料金マスタの3タブと、既に決めている利用機能の分離方針を引き継いでいます。詳細画面の内部フォームは未提供のため、このHTMLは設定項目の配置までを示しています。</div>`;
 $("#comparison-body").querySelectorAll(".mapping-link").forEach(a=>a.addEventListener("click",()=>$("#comparison-dialog").close()));
}
const dialog=$("#comparison-dialog");
document.querySelectorAll(".compare-trigger").forEach(b=>b.addEventListener("click",()=>dialog.showModal()));
$("#close-modal").addEventListener("click",()=>dialog.close());
dialog.addEventListener("click",e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
renderOverview();makeComparison();route();
window.addEventListener("hashchange",route);
</script>
</body>
</html>
